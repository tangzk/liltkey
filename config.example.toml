# 默认使用流式中英双语模型；offline 保留 SenseVoice 兼容模式。
backend = "streaming"
# 可选：用 SenseVoice 在每段提交前校正，保留边说边出字；默认关闭以兼容现有安装。
# 首次开启前运行 scripts/download-model.py --with-refinement。
# 校正失败时保留流式结果。每段音频仅在内存保留，最多 20 秒。
streaming_refine = false
# 流式定稿自动补标点；false 仅关闭标点模型，空格规范化仍启用。
punctuation = true
# punctuation_model_dir = "/absolute/path/to/punct-ct-transformer-zh-en-int8"
# 流式模型：~/.local/share/fcitx5-voice/streaming-zipformer-bilingual-zh-en-2023-02-20
# streaming_model_dir = "/absolute/path/to/streaming-zipformer-bilingual-zh-en-2023-02-20"
# SenseVoice 模型：~/.local/share/fcitx5-voice/sensevoice
# model_dir = "/absolute/path/to/sensevoice"
threads = 4
# 仅限制 Ctrl+Alt+V 切换录音；长按 Ctrl+Alt 持续到松键。
max_seconds = 30
language = "auto"
# streaming 双语模型会自动识别中英文，因此必须使用 auto。
# offline 兼容模式还支持 zh/en/ja/ko/yue。
# 留空使用默认麦克风。用 fcitx5-voice devices 查询设备名称。
device = ""
